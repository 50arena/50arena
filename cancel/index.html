<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إلغاء الحجز - 50 Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #f4f8f3;
      --accent: #0f4f33;
      --line: #d7e3db;
      --text: #143325;
      --muted: #5d756b;
      --danger: #c63939;
      --danger-bg: #fdeeee;
      --success: #146c2e;
      --success-bg: #e9f8ee;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      color: var(--text);
      font-family: "Tajawal", sans-serif;
    }

    .card {
      width: min(100%, 520px);
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid var(--line);
      border-radius: 1.5rem;
      padding: 1.5rem;
      box-shadow: 0 18px 40px rgba(15, 79, 51, 0.1);
      text-align: center;
    }

    h1 {
      margin: 0 0 0.75rem;
      color: var(--accent);
      font-size: 1.8rem;
    }

    p {
      margin: 0 0 1rem;
      color: var(--muted);
      line-height: 1.8;
    }

    .status {
      display: none;
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 1rem;
      line-height: 1.8;
      font-weight: 700;
    }

    .status.error {
      display: block;
      background: var(--danger-bg);
      color: var(--danger);
    }

    .status.success {
      display: block;
      background: var(--success-bg);
      color: var(--success);
    }

    button {
      width: 100%;
      height: 3.5rem;
      border: none;
      border-radius: 1rem;
      background: linear-gradient(135deg, #b82b2b 0%, #d94848 100%);
      color: #fff;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>إلغاء الحجز</h1>
    <p>إذا كنت متأكدًا من رغبتك بإلغاء الحجز، اضغط الزر التالي وسيتم تحرير الموعد مباشرة.</p>
    <button id="cancelBtn">تأكيد إلغاء الحجز</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    const cancelBtn = document.getElementById("cancelBtn");
    const statusBox = document.getElementById("status");
    const token = new URLSearchParams(window.location.search).get("token") || "";

    function showStatus(message, type) {
      statusBox.className = "status " + type;
      statusBox.textContent = message;
    }

    async function cancelBooking() {
      if (!token) {
        showStatus("رابط الإلغاء غير صالح", "error");
        cancelBtn.disabled = true;
        return;
      }

      cancelBtn.disabled = true;

      try {
        const response = await fetch("/api/cancel-booking", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token })
        });

        const raw = await response.text();
        let data;

        try {
          data = JSON.parse(raw);
        } catch (error) {
          data = { error: raw || "تعذر إلغاء الحجز" };
        }

        if (!response.ok) {
          showStatus(data.error || "تعذر إلغاء الحجز", "error");
          cancelBtn.disabled = false;
          return;
        }

        showStatus(data.message || "تم إلغاء الحجز بنجاح", "success");
      } catch (error) {
        showStatus("تعذر إلغاء الحجز", "error");
        cancelBtn.disabled = false;
      }
    }

    cancelBtn.addEventListener("click", cancelBooking);
  </script>
</body>
</html>
