<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>50 Arena</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #f4f8f3;
      --surface: #ffffff;
      --text: #113322;
      --muted: #597066;
      --line: #d7e3db;
      --accent: #0f4f33;
      --accent-2: #f2c94c;
      --success-bg: #e9f8ee;
      --success-text: #156b2e;
      --error-bg: #fdeeee;
      --error-text: #b00020;
      --wa: #25D366;
    }

    body {
      margin: 0;
      font-family: "Tajawal", sans-serif;
      background: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      color: var(--text);
    }

    .hero-shell {
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.08), transparent 32%),
        linear-gradient(180deg, #0d6b34 0%, var(--accent) 100%);
      color: #fff;
      padding: 2.5rem 1rem 3rem;
      position: relative;
      overflow: hidden;
    }

    .hero-shell::after {
      content: "";
      position: absolute;
      inset: auto -10% -60px;
      height: 140px;
      background: rgba(255, 255, 255, 0.06);
      filter: blur(30px);
      border-radius: 999px;
    }

    .hero-inner {
      max-width: 720px;
      margin: 0 auto;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .page {
      max-width: 720px;
      margin: -1.75rem auto 0;
      padding: 0 1rem 7rem;
      position: relative;
      z-index: 2;
    }

    .app-header {
      text-align: center;
    }

    .app-logo {
      width: min(240px, 80%);
      display: block;
      margin: 0 auto 1rem;
      filter: drop-shadow(0 14px 24px rgba(0, 0, 0, 0.15));
    }

    .app-title {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .app-slogan {
      margin-top: 0.75rem;
      color: rgba(255, 255, 255, 0.92);
      font-size: 1.05rem;
      font-weight: 500;
    }

    .card {
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid rgba(215, 227, 219, 0.95);
      border-radius: 1.5rem;
      padding: 1.25rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 28px rgba(15, 79, 51, 0.08);
    }

    .hero-title {
      text-align: center;
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 1rem;
    }

    .grid {
      display: grid;
      gap: 0.85rem;
    }

    .grid.two {
      grid-template-columns: 1fr;
    }

    .slot-group {
      margin-top: 0.9rem;
    }

    label {
      display: block;
      font-size: 1rem;
      font-weight: 800;
      margin-bottom: 0.35rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 0.95rem 1rem;
      font-size: 1rem;
      border-radius: 1rem;
      border: 1px solid var(--line);
      font-family: inherit;
      background: #fff;
    }

    input:focus, select:focus, textarea:focus {
      outline: 2px solid rgba(242, 201, 76, 0.25);
      border-color: var(--accent-2);
    }

    textarea {
      min-height: 4.5rem;
      resize: vertical;
    }

    .hint {
      font-size: 0.86rem;
      color: var(--muted);
      margin-top: 0.35rem;
    }

    .result {
      display: none;
      background: #f8fdf9;
      border: 1px dashed var(--accent-2);
      padding: 1rem;
      border-radius: 1rem;
      margin-top: 1rem;
    }

    .result ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 0.45rem;
    }

    .result-price {
      display: none;
      font-size: 2rem;
      color: #bc2f10;
      text-align: center;
      margin-top: 0.85rem;
      font-weight: 900;
    }

    .wa {
      display: none;
      background: var(--wa);
      color: #fff;
      text-align: center;
      padding: 1rem;
      margin-top: 0.75rem;
      border-radius: 1rem;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 800;
    }

    .status {
      display: none;
      margin-top: 0.85rem;
      padding: 0.9rem;
      border-radius: 1rem;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .status.success {
      display: block;
      background: var(--success-bg);
      color: var(--success-text);
    }

    .status.error {
      display: block;
      background: var(--error-bg);
      color: var(--error-text);
    }

    .status.info {
      display: block;
      background: #fff6df;
      color: #7d5c10;
    }

    .loading {
      display: none;
      margin-top: 0.75rem;
      font-size: 0.92rem;
      color: var(--muted);
      text-align: center;
    }

    .footer-contact {
      margin-top: 1.2rem;
      background: linear-gradient(180deg, #0d6b34 0%, var(--accent) 100%);
      padding: 2rem 1rem 6.5rem;
      color: #fff;
      text-align: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .footer-contact .contact-title {
      color: #fff;
      font-size: 1.1rem;
      line-height: 1.8;
      margin-bottom: 1rem;
      text-align: center;
    }

    .footer-icons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.1rem;
      flex-wrap: wrap;
    }

    .footer-icon {
      width: 46px;
      height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      font-size: 28px;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .footer-icon:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .fixed-btn {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 0.75rem 1rem max(0.75rem, env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(215, 227, 219, 0.9);
      z-index: 1000;
    }

    .fixed-btn button {
      width: min(720px, calc(100% - 2rem));
      display: block;
      margin: 0 auto;
      height: 3.8rem;
      font-size: 1.1rem;
      background: linear-gradient(135deg, var(--accent) 0%, #18704a 100%);
      color: #fff;
      border: none;
      border-radius: 1rem;
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .fixed-btn button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    @media (max-width: 520px) {
      .hero-shell {
        padding-top: 2rem;
      }

      .footer-icons {
        gap: 0.9rem;
      }

      .footer-icon {
        width: 42px;
        height: 42px;
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="hero-shell">
    <div class="hero-inner">
      <div class="app-header">
        <img class="app-logo" src="/logo.png" alt="50 Arena Logo">
        <div class="app-title" dir="ltr">50 Arena</div>
        <div class="app-slogan">أول ملعب 5×5 بمواصفات فيفا في الطفيلة</div>
      </div>
    </div>
  </div>

  <div class="page">
    <div class="card">
      <div class="hero-title">احجز موعدك</div>

      <div class="grid two">
        <div>
          <label for="date">التاريخ</label>
          <input type="date" id="date">
        </div>

        <div>
          <label for="duration">مدة الحجز</label>
          <select id="duration"></select>
        </div>
      </div>

      <div class="grid">
        <div class="slot-group">
          <label for="slot">المواعيد المتاحة</label>
          <select id="slot"></select>
          <div id="slotHint" class="hint"></div>
        </div>

        <div>
          <label for="name">الاسم</label>
          <input id="name" type="text" placeholder="اسم صاحب الحجز">
        </div>

        <div>
          <label for="phone">رقم الهاتف</label>
          <input id="phone" type="tel" placeholder="07XXXXXXXX">
        </div>

        <div>
          <label for="notes">ملاحظات</label>
          <textarea id="notes" placeholder="أي تفاصيل إضافية إن وجدت"></textarea>
        </div>
      </div>

      <div id="loading" class="loading">جارٍ التحميل...</div>
      <div id="status" class="status"></div>
      <div id="result" class="result"></div>
      <div id="price" class="result-price"></div>
      <a id="wa" class="wa" target="_blank" rel="noreferrer">تأكيد عبر واتساب</a>
    </div>
  </div>

  <div class="footer-contact">
    <div class="contact-title">ننتظرك انت وفريقك في <span dir="ltr">50 Arena</span></div>

    <div class="footer-icons">
      <a class="footer-icon" href="tel:0779605047" aria-label="اتصال">
        <i class="fa-solid fa-phone"></i>
      </a>

      <a class="footer-icon" href="https://wa.me/962779605047" target="_blank" rel="noreferrer" aria-label="واتساب">
        <i class="fa-brands fa-whatsapp"></i>
      </a>

      <a class="footer-icon" href="https://www.instagram.com/50arena" target="_blank" rel="noreferrer" aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>

      <a class="footer-icon" href="https://www.facebook.com/50arena" target="_blank" rel="noreferrer" aria-label="Facebook">
        <i class="fa-brands fa-facebook-f"></i>
      </a>
    </div>
  </div>

  <div class="fixed-btn">
    <button id="bookBtn">تثبيت الحجز</button>
  </div>

  <script>
    let settings = null;

    const dateInput = document.getElementById("date");
    const durationSelect = document.getElementById("duration");
    const slotSelect = document.getElementById("slot");
    const nameInput = document.getElementById("name");
    const phoneInput = document.getElementById("phone");
    const notesInput = document.getElementById("notes");
    const bookBtn = document.getElementById("bookBtn");
    const result = document.getElementById("result");
    const price = document.getElementById("price");
    const wa = document.getElementById("wa");
    const statusBox = document.getElementById("status");
    const loadingBox = document.getElementById("loading");
    const slotHint = document.getElementById("slotHint");

    function setLoading(show) {
      loadingBox.style.display = show ? "block" : "none";
      bookBtn.disabled = show;
    }

    function showStatus(message, type) {
      statusBox.className = "status " + type;
      statusBox.textContent = message;
    }

    function clearStatus() {
      statusBox.className = "status";
      statusBox.textContent = "";
    }

    function hideResult() {
      result.style.display = "none";
      result.innerHTML = "";
      price.style.display = "none";
      price.textContent = "";
      wa.style.display = "none";
      wa.href = "#";
    }

    function normalizeJordanPhoneLocal(phone) {
      let cleaned = String(phone || "").replace(/[^\d+]/g, "");

      if (cleaned.startsWith("00962")) {
        cleaned = "0" + cleaned.slice(5);
      } else if (cleaned.startsWith("+962")) {
        cleaned = "0" + cleaned.slice(4);
      } else if (cleaned.startsWith("962")) {
        cleaned = "0" + cleaned.slice(3);
      }

      return cleaned;
    }

    function isValidJordanPhone(phone) {
      return /^07[789]\d{7}$/.test(normalizeJordanPhoneLocal(phone));
    }

    function fillSlotPlaceholder(text) {
      slotSelect.innerHTML = "";
      const option = document.createElement("option");
      option.value = "";
      option.textContent = text;
      slotSelect.appendChild(option);
    }

    function renderBookingSummary(details) {
      const items = [
        ["الاسم", details.name],
        ["الهاتف", details.phone],
        ["التاريخ", details.date],
        ["الوقت", details.time],
        ["المدة", details.duration],
        ["الملاحظات", details.notes]
      ];

      result.innerHTML = "";
      const list = document.createElement("ul");

      items.forEach(function(entry) {
        const item = document.createElement("li");
        item.textContent = entry[0] + ": " + entry[1];
        list.appendChild(item);
      });

      result.appendChild(list);
    }

    async function loadSlots() {
      const date = dateInput.value;
      const duration = durationSelect.value;

      hideResult();
      clearStatus();
      slotHint.textContent = "";

      if (!date || !duration) {
        fillSlotPlaceholder("اختر التاريخ ومدة الحجز أولاً");
        return;
      }

      setLoading(true);

      try {
        const response = await fetch("/api/slots?date=" + encodeURIComponent(date) + "&durationMinutes=" + encodeURIComponent(duration));
        const raw = await response.text();
        let data;

        try {
          data = JSON.parse(raw);
        } catch (e) {
          data = { error: raw || "تعذر تنفيذ الحجز" };
        }

        setLoading(false);
        slotSelect.innerHTML = "";

        if (!response.ok) {
          fillSlotPlaceholder("تعذر تحميل المواعيد");
          showStatus(data.error || "حدث خطأ أثناء تحميل المواعيد", "error");
          return;
        }

        const slots = Array.isArray(data.slots) ? data.slots : [];
        if (!slots.length) {
          fillSlotPlaceholder("لا توجد مواعيد متاحة");
          slotHint.textContent = data.notice || "يرجى اختيار تاريخ أو مدة مختلفة";
          return;
        }

        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "اختر موعدًا مناسبًا";
        slotSelect.appendChild(placeholder);

        slots.forEach(function(slot) {
          const option = document.createElement("option");
          option.value = slot.value;
          option.textContent = slot.label;
          slotSelect.appendChild(option);
        });

        slotHint.textContent = data.googleReady
          ? "تظهر هنا المواعيد المتاحة فقط"
          : (data.notice || "تظهر المواعيد المتاحة مبدئيًا، وسيكتمل الربط بعد إضافة مفاتيح Google");
      } catch (error) {
        setLoading(false);
        fillSlotPlaceholder("تعذر تحميل المواعيد");
        showStatus("حدث خطأ أثناء تحميل المواعيد", "error");
      }
    }

    async function book() {
      hideResult();
      clearStatus();

      const payload = {
        date: dateInput.value,
        durationMinutes: Number(durationSelect.value),
        startIso: slotSelect.value,
        name: nameInput.value.trim(),
        phone: phoneInput.value.trim(),
        notes: notesInput.value.trim()
      };

      if (!payload.date || !payload.durationMinutes || !payload.startIso || !payload.name || !payload.phone) {
        showStatus("يرجى تعبئة جميع الحقول المطلوبة", "error");
        return;
      }

      if (!isValidJordanPhone(payload.phone)) {
        showStatus("رقم الهاتف غير صحيح", "error");
        return;
      }

      setLoading(true);

      try {
        const response = await fetch("/api/booking", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const raw = await response.text();
        let data;

        try {
          data = JSON.parse(raw);
        } catch (e) {
          data = { error: raw || "تعذر تنفيذ الحجز" };
        }

        setLoading(false);

        if (!response.ok) {
          showStatus(data.error || "تعذر تنفيذ الحجز", "error");
          return;
        }

        showStatus(data.message || "تم تأكيد الحجز بنجاح، شكرًا لاختيارك ملعب \u200E50 Arena\u200E", "success");
        renderBookingSummary(data.bookingDetails);
        price.textContent = data.bookingDetails.price;
        result.style.display = "block";
        price.style.display = "block";
        wa.href = "https://wa.me/" + data.arenaWhatsappNumber + "?text=" + encodeURIComponent(data.whatsappText);
        wa.style.display = "block";
        wa.scrollIntoView({ behavior: "smooth", block: "center" });
      } catch (error) {
        setLoading(false);
        showStatus("تعذر تنفيذ الحجز", "error");
      }
    }

    async function init() {
      fillSlotPlaceholder("اختر التاريخ ومدة الحجز أولاً");
      setLoading(true);

      try {
        const response = await fetch("/api/settings");
        const raw = await response.text();
        let data;

        try {
          data = JSON.parse(raw);
        } catch (e) {
          data = { error: raw || "تعذر تنفيذ الحجز" };
        }

        setLoading(false);

        if (!response.ok) {
          showStatus(data.error || "تعذر تحميل الصفحة", "error");
          return;
        }

        settings = data;
        dateInput.min = data.minDate;
        dateInput.max = data.maxDate;
        dateInput.value = data.minDate;

        durationSelect.innerHTML = "";
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "اختر مدة الحجز";
        placeholder.disabled = true;
        placeholder.selected = true;
        durationSelect.appendChild(placeholder);

        data.durations.forEach(function(duration) {
          const option = document.createElement("option");
          option.value = duration.value;
          option.textContent = duration.label + " - " + duration.price + " دينار";
          durationSelect.appendChild(option);
        });

        if (!data.googleReady) {
          const message = data.googleStatus && data.googleStatus.message
            ? data.googleStatus.message
            : "الواجهة تعمل الآن، لكن ربط Google غير مكتمل.";
          showStatus(message, "info");
        }
      } catch (error) {
        setLoading(false);
        showStatus("تعذر تحميل الصفحة", "error");
      }
    }

    dateInput.addEventListener("change", loadSlots);
    durationSelect.addEventListener("change", loadSlots);
    bookBtn.addEventListener("click", book);

    init();
  </script>
</body>
</html>
